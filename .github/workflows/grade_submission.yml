name: Triage Bug Bounty Submission

on:
  pull_request_target:
    types: [labeled]

concurrency:
  group: triage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  triage-report:
    # Require a repository maintainer to explicitly apply the 'ready-to-grade' label.
    # Runs exclusively when labeled to protect API quota from unreviewed push loops.
    if: github.event.action == 'labeled' && github.event.label.name == 'ready-to-grade'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Base Repository (Trusted Scripts)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Bot Dependencies
        run: |
          pip install --upgrade pip
          pip install -r bot/requirements.txt

      - name: Checkout Pull Request Submissions Content
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr_workspace
          persist-credentials: false
          sparse-checkout: |
            submissions

      - name: Identify, Validate, and Grade Changed Report File
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_NAME: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # 1. Fetch changed files list using the GitHub CLI / API
          echo "[*] Querying changed files for PR #${PR_NUMBER} in ${REPO_NAME}..."
          CHANGED_FILES=$(gh pr view "$PR_NUMBER" --repo "$REPO_NAME" --json files --jq '.files[].path')

          # 2. Filter for report markdown files in submissions/challenge-*/
          REPORT_FILES=$(echo "$CHANGED_FILES" | grep -E '^submissions/challenge-(0x)?[0-9a-fA-F]{2}/[^\/]+\.md$' || true)
          REPORT_COUNT=$(echo "$REPORT_FILES" | grep -v '^$' | wc -l | tr -d ' ')

          # Sanitize filenames for safe inclusion in markdown comments (strip backticks, dollar signs, quotes)
          SAFE_CHANGED=$(echo "$CHANGED_FILES" | tr '\n' ' ' | sed 's/[`$"\\]//g' | cut -c1-200)
          SAFE_REPORTS=$(echo "$REPORT_FILES" | tr '\n' ' ' | sed 's/[`$"\\]//g' | cut -c1-200)

          if [ "$REPORT_COUNT" -eq 0 ]; then
            echo "No report markdown file found matching \`submissions/challenge-0x01/<your-handle>-report.md\` (or \`submissions/challenge-01/...\`). Found changed files: \`${SAFE_CHANGED}\`" > failure_reason.txt
            echo "[!] Error: No valid report markdown file found."
            exit 1
          fi

          if [ "$REPORT_COUNT" -gt 1 ]; then
            echo "Pull request must add or modify exactly ONE report file. Found $REPORT_COUNT: \`${SAFE_REPORTS}\`" > failure_reason.txt
            echo "[!] Error: Pull request must add or modify exactly ONE report file."
            exit 1
          fi

          TARGET_REL_PATH="$REPORT_FILES"
          SAFE_TARGET=$(echo "$TARGET_REL_PATH" | sed 's/[`$"\\]//g')
          FULL_REPORT_PATH="pr_workspace/${TARGET_REL_PATH}"

          echo "[*] Target report file identified: $FULL_REPORT_PATH"

          # 3. Security Check: Reject symlinks and non-regular files
          if [ -L "$FULL_REPORT_PATH" ]; then
            echo "Report file cannot be a symbolic link: \`${SAFE_TARGET}\`" > failure_reason.txt
            echo "[!] Security Violation: Report file cannot be a symbolic link!"
            exit 1
          fi

          if [ ! -f "$FULL_REPORT_PATH" ]; then
            echo "Report file is not a regular file: \`${SAFE_TARGET}\`" > failure_reason.txt
            echo "[!] Error: Report file is not a regular file!"
            exit 1
          fi

          # 4. Security Check: File size cap (max 64 KB = 65,536 bytes)
          FILE_SIZE=$(wc -c < "$FULL_REPORT_PATH" | tr -d ' ')
          if [ "$FILE_SIZE" -gt 65536 ]; then
            echo "Report file exceeds maximum allowed size of 64 KB (current size: ${FILE_SIZE} bytes)." > failure_reason.txt
            echo "[!] Security Violation: Report file exceeds maximum allowed size of 64 KB."
            exit 1
          fi

          # 5. Run the Triage Bot (fails closed on missing API key or upstream error)
          python bot/triage_bot.py \
            --report "$FULL_REPORT_PATH" \
            --pr-number "$PR_NUMBER" \
            --repo "$REPO_NAME" \
            --sha "$HEAD_SHA"

      - name: Post Triage Failure Explanation to PR
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_NAME: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          REASON="The automated triage evaluation failed during verification."
          if [ -f failure_reason.txt ]; then
            REASON=$(cat failure_reason.txt | tr -d '\r')
          fi

          COMMENT_BODY=$(cat <<EOF
### ❌ NBody Labs 0xRange: Triage Evaluation Failed

**Commit**: \`${HEAD_SHA:0:7}\` (\`${HEAD_SHA}\`)

**Failure Details**:
> ${REASON}

#### How to resolve:
1. Ensure your vulnerability report is located at \`submissions/challenge-0x01/<your-handle>-report.md\` (or \`submissions/challenge-01/<your-handle>-report.md\`).
2. Verify that your PR modifies **exactly one** regular markdown file under 64 KB.
3. Follow the format in [\`templates/REPORT_TEMPLATE.md\`](templates/REPORT_TEMPLATE.md).
EOF
)

          gh pr comment "$PR_NUMBER" --repo "$REPO_NAME" --body "$COMMENT_BODY" || true
